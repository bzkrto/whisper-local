<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whisper · Mobil</title>
<style>body{font:16px system-ui;background:#101820;color:#edf3f8;margin:0}main{max-width:740px;margin:auto;padding:22px}h1{font-size:27px}small{color:#b3c5d3}input,textarea,button{font:inherit;border:1px solid #405869;border-radius:10px;padding:12px;box-sizing:border-box}input,textarea{width:100%;background:#1a2834;color:white;margin:8px 0}button{background:#bce7d8;color:#102c24;cursor:pointer;margin:4px 2px}button:disabled{opacity:.5}#messages{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;min-height:150px}.entry{padding:14px;border-bottom:1px solid #344653}.user{color:#a8dccc}label{display:block}nav{margin:15px 0}#status{min-height:24px;color:#f3ce83}</style>
<main><h1>Whisper <small>mobil</small></h1><p>Bilgisayarınızdaki aynı asistan, hafıza ve araştırma gündemi.</p>
<label>Bilgisayarda gösterilen bağlantı jetonu<input id="token" type="password" autocomplete="off" placeholder="Jetonu buraya yapıştırın"></label>
<small>Jeton yalnız bu sayfa açıkken bellekte tutulur. Bilgisayar ve Whisper açık olmalıdır.</small>
<nav><button data-command="Bugün neler öğrendin?">Bugün öğrendiklerin</button><button data-command="Otomatik araştırma durumu">Araştırma</button><button data-command="Tanışmaya başlayalım">Beni tanı</button><button data-command="Kendini değerlendir">Değerlendirme</button></nav>
<div id="messages" aria-live="polite"></div><div id="status" role="status"></div>
<form id="form"><label>Mesajınız<textarea id="text" rows="3" maxlength="2000" placeholder="Yazın veya telefon klavyesinin mikrofonunu kullanın"></textarea></label><button id="send">Gönder</button><button type="button" id="stop">Dur</button><label><input id="voice" type="checkbox" style="width:auto"> Yanıtı telefonda seslendir</label></form>
<div id="files"></div></main><script>
const $=id=>document.getElementById(id);let busy=false;
function show(who,text){const e=document.createElement('div');e.className='entry '+(who==='Siz'?'user':'');e.textContent=who+': '+text;$('messages').append(e);e.scrollIntoView({behavior:'smooth',block:'end'});}
function speak(text){if($('voice').checked&&'speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='tr-TR';speechSynthesis.speak(u);}}
async function send(text,interrupt=false){if((busy&&!interrupt)||!text.trim())return;if(!$('token').value.trim()){$('status').textContent='Bilgisayardaki bağlantı jetonunu girin.';return;}if(!interrupt){busy=true;$('send').disabled=true;show('Siz',text);$('text').value='';$('status').textContent='Whisper yanıtlıyor…';}
try{const r=await fetch('/mesaj',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+$('token').value.trim()},body:JSON.stringify({text})});const d=await r.json();if(!r.ok)throw new Error(d.yanit||d.hata||'Bağlantı hatası');show('Whisper',d.yanit);if(!interrupt)speak(d.yanit);for(const f of d.dosyalar||[]){const b=document.createElement('button');b.textContent=f.name;b.onclick=async()=>{try{const res=await fetch(f.url,{headers:{Authorization:'Bearer '+$('token').value.trim()}});if(!res.ok)throw Error('Dosya alınamadı');const url=URL.createObjectURL(await res.blob());const a=document.createElement('a');a.href=url;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(e){$('status').textContent=e.message;}};$('files').append(b);}$('status').textContent=d.durum||'';}catch(e){$('status').textContent=e.message+' · Tekrar göndermeden önce işlemin gerçekleşip gerçekleşmediğini kontrol edin.';}finally{if(!interrupt){busy=false;$('send').disabled=false;}}}
$('form').onsubmit=e=>{e.preventDefault();send($('text').value);};document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>send(b.dataset.command));$('stop').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();send('Dur',true);};
</script></html>
